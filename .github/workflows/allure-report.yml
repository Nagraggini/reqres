name: Test Suite & Allure Report

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create .env file from secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "API_KEY=$API_KEY" > .env
          mkdir -p target/classes
          cp .env target/classes/.env

      - name: Run REST Assured Tests with Maven
        run: mvn clean test
        continue-on-error: true

      - name: Set up Node.js for Allure CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Allure Report
        run: |
          # Összemásoljuk az esetlegesen a target/allure-results mappában keletkezett fájlokat
          mkdir -p allure-results
          if [ -d "target/allure-results" ]; then cp -r target/allure-results/* allure-results/ 2>/dev/null || true; fi
          npx allure-commandline generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: false